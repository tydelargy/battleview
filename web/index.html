<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <div id="world" hidden aria-label="All repositories"></div>
  <div id="stage"></div>
  <div id="nogl" hidden></div>

  <header class="hud">
    <div class="row1">
      <div class="brand">BATTLE MAP<small id="sub">loading</small></div>
      <div class="right">
        <button class="icon" id="worldBtn" hidden aria-label="Back to all repositories" title="Back to all repositories"><span class="glyph">&#11041;</span><span>ALL REPOS</span></button>
        <div class="counters" id="counters"></div>
        <button class="icon" id="bellBtn" aria-label="Notifications" title="Notifications"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><b id="bellCount" hidden></b></button>
        <button class="icon" id="alertsBtn" aria-label="Alerts" title="Alerts"><span class="glyph">&#9873;</span><b id="alertCount" hidden></b></button>
        <button class="icon" id="jiraPill" aria-label="Jira connection" title="Jira connection"><i class="dot" id="jiraDot"></i><span id="jiraTxt">Jira</span></button>
        <button class="icon" id="settingsBtn" aria-label="Settings" title="Settings"><span class="glyph">&#9881;</span></button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <aside id="focus" hidden aria-label="Focused pull request"></aside>
  <div id="baseBanner" hidden role="status" aria-live="polite"></div>
  <div id="tip" hidden></div>
  <div id="filebar" hidden role="group" aria-label="Watch this file"></div>
  <div id="fab">
    <button class="fabbtn" id="layersBtn" aria-label="Layers and view options" aria-expanded="false" title="Layers"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12.2 9 5 9-5"/><path d="m3 16.4 9 5 9-5"/></svg></button>
    <button class="fabbtn txt" id="keyBtn" aria-label="Key" title="Key">KEY</button>
    <button class="fabbtn txt" id="homeBtn" aria-label="Fit whole map" title="Fit whole map">FIT</button>
  </div>
  <div id="layers" hidden role="dialog" aria-label="Layers and view options"></div>
  <div id="filters" hidden role="dialog" aria-label="Filter and sort PRs"></div>

  <section id="sheet"><div id="cards"></div></section>

  <aside id="alerts" hidden aria-label="Alerts"></aside>
  <aside id="notifs" hidden aria-label="Notifications"></aside>
  <div id="modal" hidden><div class="msheet" id="msheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
